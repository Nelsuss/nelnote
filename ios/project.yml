# XcodeGen 설정: 이 파일로 Xcode 프로젝트를 자동으로 만든다 (네이티브 SwiftUI 버전)
name: NelNote
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NelNote:
    type: application
    platform: iOS
    sources:
      - path: Native
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NEL NOTE
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelnote.app
        PRODUCT_NAME: NelNote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
