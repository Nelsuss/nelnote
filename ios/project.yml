# XcodeGen 설정: 이 파일로 Xcode 프로젝트를 자동으로 만든다 (맥에서 직접 만들 필요 없음)
name: NelNote
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NelNote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Assets.xcassets
      - path: Web          # 빌드할 때 저장소 맨 위의 화면 파일이 여기로 복사된다
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NEL NOTE
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 배경 사진을 직접 찍어서 쓸 때 카메라를 사용해요.
        NSPhotoLibraryUsageDescription: 배경으로 쓸 사진을 사진 보관함에서 골라요.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelnote.app
        PRODUCT_NAME: NelNote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
